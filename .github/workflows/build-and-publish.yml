# 构建并发布 MakcRe/KuGouMusicApi 的多架构 Docker 镜像到 GitHub Packages
name: Build and publish Docker image

on:
  push:
    branches:
      - main
  # 每周一执行一次（cron 使用 UTC，等价于北京时间每周一 08:00）
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

# 需要写 packages 权限以便发布到 GitHub Packages
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          repository: MakcRe/KuGouMusicApi
          path: source
          # 如果源仓库默认分支不是 main，请改这里的 ref 为相应分支或提交 sha
          ref: main
          fetch-depth: 0

      - name: Add custom Dockerfile
        run: |
          cd source/
          cat > Dockerfile.custom << 'EOF'
          FROM node:lts-alpine
          RUN apk add --no-cache tini
          RUN corepack enable
          ENV NODE_ENV=production
          WORKDIR /app
          RUN chown node:node /app
          COPY --chown=node:node package.json pnpm-lock.yaml ./
          USER node
          RUN pnpm install --prod --frozen-lockfile
          COPY --chown=node:node . ./
          EXPOSE 3000
          ENTRYPOINT ["/sbin/tini", "--"]
          CMD ["node", "app.js"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 使用 node 读取 package.json 的 version 字段并通过 GITHUB_OUTPUT 导出
      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./source/package.json').version")
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from source/package.json"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 记录本次构建实际对应的源码提交，用作镜像 tag 与重复构建判断依据
      - name: Resolve source commit hash
        id: source
        run: |
          SHA=$(git -C source rev-parse HEAD)
          if [ -z "$SHA" ]; then
            echo "Failed to resolve source commit hash"
            exit 1
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "short=${SHA:0:7}" >> $GITHUB_OUTPUT
          echo "Source commit: $SHA"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 若该 commit 对应的镜像已存在于 GHCR，则跳过后续构建与推送
      - name: Check whether this commit was already published
        id: check
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/kgapi
          TAG="sha-${{ steps.source.outputs.short }}"
          if docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "Image $IMAGE:$TAG already exists, skip build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Image $IMAGE:$TAG not found, will build."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push multi-arch image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./source
          # 如果源码中 Dockerfile 路径不同，请改为相应路径
          file: ./source/Dockerfile.custom
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kgapi:${{ steps.get_version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kgapi:v${{ steps.get_version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kgapi:sha-${{ steps.source.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/kgapi:latest
          labels: |
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=https://github.com/MakcRe/KuGouMusicApi

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            echo "Skipped: commit ${{ steps.source.outputs.short }} already published." >> $GITHUB_STEP_SUMMARY
          else
            echo "Published images for commit ${{ steps.source.outputs.short }}." >> $GITHUB_STEP_SUMMARY
          fi
